name: Nine Innings regression
on:
  pull_request:
  push:
    branches: [main, feature/realistic-season-v1]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts jsdom@26
      - run: node --test tests/*.test.cjs
